name: Deploy static frontend to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vinoveil-static-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install existing locked dependencies
        run: |
          npm ci --no-audit --no-fund
          npm test
      - name: Restore current generated public Amplify configuration
        env:
          AMPLIFY_OUTPUTS_JSON: ${{ secrets.AMPLIFY_OUTPUTS_JSON }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { writeFile } from 'node:fs/promises';
          const raw = process.env.AMPLIFY_OUTPUTS_JSON || '';
          const outputs = JSON.parse(raw);
          assert.ok(outputs.auth?.user_pool_id && outputs.auth?.user_pool_client_id);
          assert.equal(new URL(outputs.data?.url || '').protocol, 'https:');
          assert.ok(outputs.data?.model_introspection);
          await writeFile('amplify_outputs.json', raw);
          console.log('Existing public auth/data configuration restored without an Amplify backend deployment.');
          NODE
      - name: Verify and build the existing frontend
        run: |
          npm run build
          test -s dist/index.html
          test ! -e dist/_redirects
          test ! -e dist/404.html
          test ! -e dist/_worker.js
      - name: Upload frontend assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4.129.0 pages deploy dist \
            --project-name vinoveil \
            --branch main \
            --commit-hash "$GITHUB_SHA" \
            --commit-dirty=true
