name: Deploy static frontend to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vinoveil-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install existing locked dependencies
        run: |
          npm install --global npm@11.4.2 --no-audit --no-fund
          npm ci --legacy-peer-deps --no-audit --no-fund
          npm test
      - name: Verify the reviewed native backend origin
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          assert.equal(process.env.VITE_API_BASE_URL, 'https://api.vinoveil.com');
          const response = await fetch(`${process.env.VITE_API_BASE_URL}/api/health`, { cache: 'no-store' });
          assert(response.ok, 'Backend is not ready.');
          const backend = await response.json();
          assert.equal(backend.releaseSha, process.env.GITHUB_SHA, 'Deploy the backend from this exact main commit first.');
          assert(backend.trafficEnabled && backend.emailEnabled && backend.writesEnabled && backend.authConfigured, 'Backend is paused or authentication/email is not ready.');
          console.log('Reviewed native backend matches this exact frontend source.');
          NODE
      - name: Verify and build the existing frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          npm run build
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          writeFileSync('dist/release.json', JSON.stringify({ sourceSha: process.env.GITHUB_SHA, backendSha: process.env.GITHUB_SHA }));
          NODE
          test -s dist/index.html
          test -s dist/assets/404.html
          test ! -e dist/_redirects
          test ! -e dist/404.html
          test ! -e dist/_worker.js
      - name: Upload frontend assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4.129.0 pages deploy dist \
            --project-name vinoveil \
            --branch main \
            --commit-hash "$GITHUB_SHA" \
            --commit-dirty=true
      - name: Verify the immutable frontend release receipt
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { setTimeout } from 'node:timers/promises';
          let receipt;
          for (let attempt = 0; attempt < 12; attempt++) {
            const response = await fetch('https://vinoveil.com/release.json', { cache: 'no-store', signal: AbortSignal.timeout(5000) });
            assert(response.ok, 'Frontend release receipt is unavailable.');
            receipt = await response.json().catch(() => null);
            if (receipt?.sourceSha === process.env.GITHUB_SHA && receipt?.backendSha === process.env.GITHUB_SHA) break;
            if (attempt < 11) await setTimeout(5000);
          }
          assert(receipt, 'Frontend release receipt did not become JSON within the propagation window.');
          assert.equal(receipt.sourceSha, process.env.GITHUB_SHA);
          assert.equal(receipt.backendSha, process.env.GITHUB_SHA);
          console.log(`Frontend and backend source: ${process.env.GITHUB_SHA}`);
          NODE
